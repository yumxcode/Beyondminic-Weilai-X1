     right_ankle_roll_joint, left_shoulder_yaw_joint,
     right_shoulder_yaw_joint, left_elbow_joint, right_elbow_joint,
     left_wrist_roll_joint, right_wrist_roll_joint,
     left_wrist_pitch_joint, right_wrist_pitch_joint,
