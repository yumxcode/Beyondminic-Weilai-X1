      .venv/bin/python whole_body_tracking/scripts/play_mujoco.py --robot f1
      --headless --checkpoint trained_models/dance_f1_v3_model_4999.pt
      --motion whole_body_tracking/motions/dance2s1_arm_f1.npz --max_steps 3750
    loops: 5 (3750 steps, 75 s)
    fall_detected: false
    mean_joint_pos_err_rad: 0.1315     # v1: 0.2012 (-35%)
