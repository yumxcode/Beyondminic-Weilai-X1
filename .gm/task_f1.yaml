key_fixes:
  physx_order: >
    F1 PhysX joint order is FIFO-BFS over the URDF tree (shoulders before
    knees/ankles within a wave) — differs from X1's alphabetical variant and
    from the initial guess at 5 slots. Ground truth from probe task
    TASK_20261105_507 (probe_f1_order.py). Wrong order made sim2sim collapse
    in 0.2 s with obs z-score -23 sigma on the command segment.

deployment:
  kp/kd: per F1_29DOF/f1_kp_kd.json (legs from URDF inertia + estimated armature,
    upper body X1 PlanB identified values); armature injected at play time.

