[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyondmimic-g1"
version = "0.2.0"
description = "BeyondMimic training-to-deployment workflow for the 29-DoF Unitree G1"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "onnxruntime>=1.17",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]
test = ["pytest>=8.0"]

[project.scripts]
beyondmimic-validate = "beyondmimic_g1.validate:main"
beyondmimic-sim2sim = "beyondmimic_g1.sim2sim:main"
beyondmimic-sim2real = "beyondmimic_g1.sim2real:main"

[tool.setuptools.packages.find]
include = ["beyondmimic_g1*"]
